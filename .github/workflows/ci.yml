name: SignalScope checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_supabase:
        description: Apply migrations and test the dedicated Supabase test database
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  supabase-integration:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.verify_supabase &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    environment: supabase-test
    concurrency:
      group: supabase-integration
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
      RUN_DATABASE_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Require dedicated database secret
        run: python -c "import os; assert os.getenv('DATABASE_URL'), 'Configure SUPABASE_TEST_DATABASE_URL in the supabase-test environment'"
      - run: alembic upgrade head
      - run: pytest tests/test_database_integration.py
